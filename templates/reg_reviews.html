{% extends "base.html" %} {% block title %}리뷰 등록{% endblock %} {% block
content %}
<h2>리뷰 등록</h2>

<p>상품에 대한 리뷰를 작성할 수 있는 페이지입니다.</p>

<form id="reviewForm" action="/reviews/new" method="post" enctype="multipart/form-data">
  <input type="hidden" name="product_id" value="{{ request.args.get('product_id', '') }}" />
  <label for="product_name">상품명:</label>
  <input type="text" id="product_name" name="product_name" value="{{ request.args.get('product_name', '') }}" readonly required />
  <br /><br />

  <label for="title">리뷰 제목:</label>
  <input type="text" id="title" name="title" required />
  <br /><br />

  <label for="photo">사진 파일:</label>
  <input type="file" id="photo" name="photo" accept=".png,.jpg,.jpeg,.gif,.webp" required />
  <br /><br />

  <label for="rating">별점:</label>
  <select id="rating" name="rating" required>
    <option value="5">5점</option>
    <option value="4">4점</option>
    <option value="3">3점</option>
    <option value="2">2점</option>
    <option value="1">1점</option>
  </select>
  <br /><br />

  <label for="body">리뷰 내용:</label>
  <textarea id="body" name="body" rows="5" required></textarea>
  <br /><br />

  <button type="submit">리뷰 등록</button>
</form>



{% endblock %}
