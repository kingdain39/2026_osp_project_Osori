{% extends "base.html" %} {% block title %}Login{% endblock %} {% block content
%} {% with messages = get_flashed_messages() %} {% if messages %}
<script>
  {% for message in messages %}
    alert({{ message | tojson }});
  {% endfor %}
</script>
{% endif %} {% endwith %}
<form action="/login_confirm" method="post">
  <p>ID : <input type="text" name="user_id" required /></p>
  <p>Password : <input type="password" name="password" required /></p>
  <p>
    Input ID and password, and click the login button<br />
    <input type="submit" value="Login" />
  </p>
</form>
<button onclick="location.href = '/signup'">Signup</button>
{% endblock %}
