{% extends "base.html" %}

{% block title %}Register Items{% endblock %}

{% block content %}
<form action="/submit_item_post" method="post" enctype="multipart/form-data">
    <div>
        <label for="prodName">Product name:</label>
        <input type="text" id="prodName" name="prodName" required>
    </div>
    
    <div>
        <label for="sellerId">Seller ID:</label>
        <input type="text" id="sellerId" name="sellerId" required>
    </div>
    
    <div>
        <label for="address">Address:</label>
        <input type="text" id="address" name="address">
    </div>
    
    <div>
        <label for="price">Price:</label>
        <input type="number" id="price" name="price" required>
    </div>
    
    <div>
        <label for="status">Status?</label><br>
        <select id="status" name="status">
            <option value="new">New</option>
            <option value="lnew" selected>Likely New</option>
            <option value="used">Used</option>
        </select>
    </div>
    
    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
    </div>
    
    <div>
        <label for="repImg">Representative Image upload :</label>
        <input type="file" id="repImg" name="repImg" accept="image/*" required>
    </div>
    
    <div>
        <input type="submit" value="Submit!">
    </div>
</form>
{% endblock %}
